<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelly AI | Smart Trip Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .loader { border-top-color: #f43f5e; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-white text-slate-900">

    <!-- Simple API Key Banner (For Security) -->
    <div id="setup-banner" class="bg-slate-900 text-white text-xs py-2 px-4 flex justify-center items-center gap-4">
        <span>Enter Gemini API Key to enable AI features:</span>
        <input type="password" id="apiKey" placeholder="Paste Key Here" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 outline-none focus:border-rose-500 w-48 text-white">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="underline text-slate-400 hover:text-white">Get Key</a>
    </div>

    <!-- Navigation -->
    <nav class="border-b border-slate-100 py-5 px-8 flex justify-between items-center sticky top-0 bg-white z-50">
        <div class="flex items-center gap-2 text-rose-500">
            <i data-lucide="sparkles" size="28" stroke-width="2.5"></i>
            <span class="text-xl font-bold tracking-tight">travelly<span class="text-slate-400 font-light">AI</span></span>
        </div>
        <div class="flex items-center gap-4 border border-slate-200 rounded-full py-1 px-2 shadow-sm">
            <i data-lucide="menu" size="18" class="ml-2"></i>
            <div class="bg-rose-500 text-white p-1.5 rounded-full">
                <i data-lucide="user" size="16"></i>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pt-12 pb-24">
        
        <!-- Hero & AI Search Pill -->
        <div class="text-center mb-16">
            <h1 class="text-5xl font-bold tracking-tight mb-4">Plan with Intelligence.</h1>
            <p class="text-slate-500 mb-10">Real-time events and weather-aware packing lists via Gemini AI.</p>
            
            <div class="inline-flex flex-wrap md:flex-nowrap items-center bg-white border border-slate-200 rounded-full p-2 shadow-2xl max-w-3xl w-full mx-auto">
                <div class="flex-1 px-6 py-2 text-left border-r border-slate-100">
                    <label class="block text-[10px] font-bold uppercase text-rose-500">Destination</label>
                    <input id="destInput" type="text" placeholder="Where to?" class="w-full outline-none text-sm font-medium">
                </div>
                <div class="flex-1 px-6 py-2 text-left">
                    <label class="block text-[10px] font-bold uppercase text-rose-500">Travel Date</label>
                    <input id="dateInput" type="date" class="w-full outline-none text-sm text-slate-600">
                </div>
                <button onclick="generatePlan()" id="searchBtn" class="bg-rose-500 hover:bg-rose-600 text-white px-8 py-4 rounded-full transition-all font-bold flex items-center gap-2">
                    <span id="btnText">Search</span>
                    <div id="btnLoader" class="hidden loader w-4 h-4 border-2 border-white rounded-full"></div>
                </button>
            </div>
        </div>

        <!-- AI RESULTS SECTION -->
        <div id="results" class="hidden space-y-16 animate-in fade-in slide-in-from-bottom-4 duration-700">
            
            <!-- Events & Clothing Advice Row -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Events -->
                <div class="lg:col-span-2">
                    <div class="flex items-center gap-2 mb-6">
                        <i data-lucide="calendar-days" class="text-rose-500"></i>
                        <h2 class="text-2xl font-bold">Local Events & Festivals</h2>
                    </div>
                    <div id="eventsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- AI Injected Events -->
                    </div>
                </div>

                <!-- Packing & Advice -->
                <div class="bg-slate-50 rounded-[32px] p-8 border border-slate-100">
                    <h2 class="text-xl font-bold mb-4">Travel Preparedness</h2>
                    
                    <div id="clothingAdvice" class="bg-white p-4 rounded-2xl mb-6 text-sm italic text-slate-600 border border-slate-200">
                        <!-- AI Advice -->
                    </div>

                    <h3 class="text-xs font-bold uppercase text-slate-400 mb-4 tracking-widest">Recommended Gear</h3>
                    <ul id="packingList" class="space-y-3">
                        <!-- AI Packing -->
                    </ul>
                </div>
            </div>

            <!-- Must See Places -->
            <div>
                <h2 class="text-3xl font-bold mb-8">Curated Recommendations</h2>
                <div id="placesGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <!-- AI Places -->
                </div>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        async function generatePlan() {
            const key = document.getElementById('apiKey').value;
            const dest = document.getElementById('destInput').value;
            const date = document.getElementById('dateInput').value;

            if (!key) return alert("Please enter your Gemini API Key in the top banner.");
            if (!dest || !date) return alert("Please fill in destination and date.");

            // Loading UI
            toggleLoading(true);

            const prompt = `Act as a professional travel guide. Create a travel plan for ${dest} for the date ${date}. 
            1. Search for 3 specific real-time events, festivals, or concerts happening in ${dest} around ${date}.
            2. Provide a specific clothing advice paragraph based on the typical weather for ${dest} in that month (e.g., "It's rainy season, bring an umbrella").
            3. List 5 specific packing items.
            4. Suggest 3 must-see permanent places of interest.
            Return ONLY a JSON object with this structure:
            {
              "clothingAdvice": "string",
              "packingList": ["item1", "..."],
              "events": [{"name": "string", "desc": "string", "date": "string"}],
              "places": [{"name": "string", "type": "string", "rating": "string"}]
            }`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                const textResponse = data.candidates[0].content.parts[0].text;
                
                // Clean the JSON response (strip markdown code blocks if present)
                const cleanedJson = textResponse.replace(/```json|```/gi, '').trim();
                const plan = JSON.parse(cleanedJson);

                renderUI(plan);
            } catch (error) {
                console.error(error);
                alert("Error fetching AI data. Check your key and connection.");
            } finally {
                toggleLoading(false);
            }
        }

        function renderUI(plan) {
            const results = document.getElementById('results');
            results.classList.remove('hidden');

            // Render Events
            const eventsContainer = document.getElementById('eventsContainer');
            eventsContainer.innerHTML = plan.events.map(e => `
                <div class="bg-white border border-slate-100 p-5 rounded-2xl shadow-sm hover:shadow-md transition-all">
                    <span class="text-[10px] font-bold text-rose-500 uppercase">${e.date}</span>
                    <h3 class="font-bold text-lg mt-1">${e.name}</h3>
                    <p class="text-sm text-slate-500 mt-2">${e.desc}</p>
                </div>
            `).join('');

            // Render Advice & Packing
            document.getElementById('clothingAdvice').innerText = plan.clothingAdvice;
            document.getElementById('packingList').innerHTML = plan.packingList.map(item => `
                <li class="flex items-center gap-3 text-sm font-medium">
                    <i data-lucide="check-circle-2" size="16" class="text-rose-500"></i>
                    ${item}
                </li>
            `).join('');

            // Render Places
            document.getElementById('placesGrid').innerHTML = plan.places.map(p => `
                <div class="group cursor-pointer">
                    <div class="relative aspect-[4/5] overflow-hidden rounded-3xl mb-4 bg-slate-200">
                        <img src="https://source.unsplash.com/800x1000/?${p.name},travel" class="object-cover w-full h-full group-hover:scale-110 transition-transform duration-700">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                        <div class="absolute bottom-6 left-6 text-white">
                            <p class="text-xs font-medium opacity-80">${p.type}</p>
                            <h3 class="text-xl font-bold">${p.name}</h3>
                        </div>
                    </div>
                    <div class="flex justify-between items-center px-1">
                         <a href="#" class="text-xs font-bold text-rose-500 flex items-center gap-1">
                            <i data-lucide="camera" size="14"></i> LINK TRAVEL PHOTOS
                         </a>
                         <span class="text-xs text-slate-400">★ ${p.rating}</span>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
            results.scrollIntoView({ behavior: 'smooth' });
        }

        function toggleLoading(isLoading) {
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const searchBtn = document.getElementById('searchBtn');

            if (isLoading) {
                btnText.innerText = "Consulting AI...";
                btnLoader.classList.remove('hidden');
                searchBtn.classList.add('opacity-80', 'cursor-not-allowed');
            } else {
                btnText.innerText = "Search";
                btnLoader.classList.add('hidden');
                searchBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>

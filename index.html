<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelly AI | Smart Trip Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .loader { border-top-color: #f43f5e; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-white text-slate-900">

    <!-- API Key Banner -->
    <div id="setup-banner" class="bg-slate-900 text-white text-[10px] md:text-xs py-2 px-4 flex justify-center items-center gap-4">
        <span>Enter Gemini API Key:</span>
        <input type="password" id="apiKey" placeholder="Paste Key Here" class="bg-slate-800 border border-slate-700 rounded px-2 py-0.5 outline-none focus:border-rose-500 w-32 md:w-48 text-white">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="underline text-slate-400 hover:text-white">Get Free Key</a>
    </div>

    <nav class="border-b border-slate-100 py-5 px-8 flex justify-between items-center sticky top-0 bg-white z-50">
        <div class="flex items-center gap-2 text-rose-500">
            <i data-lucide="sparkles" size="28"></i>
            <span class="text-xl font-bold tracking-tight text-slate-900">travelly<span class="text-rose-500">AI</span></span>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pt-12 pb-24">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">Travel Smarter.</h1>
            <p class="text-slate-500 text-lg mb-10">AI-powered events, weather advice, and packing lists.</p>
            
            <div class="inline-flex flex-wrap md:flex-nowrap items-center bg-white border border-slate-200 rounded-2xl md:rounded-full p-2 shadow-2xl max-w-3xl w-full mx-auto">
                <div class="w-full md:flex-1 px-6 py-2 text-left border-b md:border-b-0 md:border-r border-slate-100">
                    <label class="block text-[10px] font-bold uppercase text-rose-500">Destination</label>
                    <input id="destInput" type="text" placeholder="e.g. Tokyo, Paris" class="w-full outline-none text-sm font-medium">
                </div>
                <div class="w-full md:flex-1 px-6 py-2 text-left">
                    <label class="block text-[10px] font-bold uppercase text-rose-500">Travel Date</label>
                    <input id="dateInput" type="date" class="w-full outline-none text-sm text-slate-600">
                </div>
                <button onclick="generatePlan()" id="searchBtn" class="w-full md:w-auto bg-rose-500 hover:bg-rose-600 text-white px-8 py-4 rounded-xl md:rounded-full transition-all font-bold flex justify-center items-center gap-2">
                    <span id="btnText">Plan My Trip</span>
                    <div id="btnLoader" class="hidden loader w-4 h-4 border-2 border-white rounded-full"></div>
                </button>
            </div>
        </div>

        <!-- Debugging Message Box (Hidden unless error) -->
        <div id="errorBox" class="hidden max-w-3xl mx-auto mb-8 p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm"></div>

        <div id="results" class="hidden space-y-16 animate-in fade-in slide-in-from-bottom-4 duration-700">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2">
                    <div class="flex items-center gap-2 mb-6">
                        <i data-lucide="calendar-days" class="text-rose-500"></i>
                        <h2 class="text-2xl font-bold">What's Happening</h2>
                    </div>
                    <div id="eventsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>

                <div class="bg-slate-50 rounded-[32px] p-8 border border-slate-100">
                    <h2 class="text-xl font-bold mb-4">Pro Advice</h2>
                    <div id="clothingAdvice" class="bg-white p-4 rounded-2xl mb-6 text-sm italic text-slate-600 border border-slate-200"></div>
                    <h3 class="text-xs font-bold uppercase text-slate-400 mb-4 tracking-widest">Packing Essentials</h3>
                    <ul id="packingList" class="space-y-3"></ul>
                </div>
            </div>

            <div>
                <h2 class="text-3xl font-bold mb-8">Curated Places</h2>
                <div id="placesGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // Static fallback images because Unsplash Source is dead
        const fallbackImages = [
            "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=1000&auto=format&fit=crop"
        ];

        async function generatePlan() {
            const key = document.getElementById('apiKey').value.trim();
            const dest = document.getElementById('destInput').value.trim();
            const date = document.getElementById('dateInput').value;
            const errorBox = document.getElementById('errorBox');
            
            errorBox.classList.add('hidden');

            if (!key) { alert("Please enter a Gemini API Key."); return; }
            if (!dest || !date) { alert("Destination and Date are required."); return; }

            toggleLoading(true);

            const prompt = `Create a travel plan for ${dest} on ${date}. 
            1. Find 3 real events/festivals happening then.
            2. Give specific clothing advice for the climate there in that month.
            3. List 5 packing items.
            4. Suggest 3 must-see places.
            Return ONLY a valid JSON object:
            {
              "clothingAdvice": "string",
              "packingList": ["item1", "item2", "item3", "item4", "item5"],
              "events": [{"name": "string", "desc": "string", "date": "string"}],
              "places": [{"name": "string", "type": "string", "rating": "string"}]
            }`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || "API Error");
                }

                let textResponse = data.candidates[0].content.parts[0].text;
                const cleanedJson = textResponse.replace(/```json|```/gi, '').trim();
                const plan = JSON.parse(cleanedJson);

                renderUI(plan);
            } catch (error) {
                console.error(error);
                errorBox.innerText = "Error: " + error.message + ". Make sure your API key is correct and you have an internet connection.";
                errorBox.classList.remove('hidden');
            } finally {
                toggleLoading(false);
            }
        }

        function renderUI(plan) {
            document.getElementById('results').classList.remove('hidden');

            // Events
            document.getElementById('eventsContainer').innerHTML = plan.events.map(e => `
                <div class="bg-white border border-slate-100 p-5 rounded-2xl shadow-sm">
                    <span class="text-[10px] font-bold text-rose-500 uppercase">${e.date}</span>
                    <h3 class="font-bold text-lg mt-1">${e.name}</h3>
                    <p class="text-sm text-slate-500 mt-2">${e.desc}</p>
                </div>
            `).join('');

            // Advice
            document.getElementById('clothingAdvice').innerText = plan.clothingAdvice;
            document.getElementById('packingList').innerHTML = plan.packingList.map(item => `
                <li class="flex items-center gap-3 text-sm font-medium">
                    <i data-lucide="check-circle-2" size="16" class="text-rose-500"></i> ${item}
                </li>
            `).join('');

            // Places
            document.getElementById('placesGrid').innerHTML = plan.places.map((p, i) => `
                <div class="group cursor-pointer">
                    <div class="relative aspect-[4/5] overflow-hidden rounded-3xl mb-4 bg-slate-200">
                        <img src="${fallbackImages[i] || fallbackImages[0]}" class="object-cover w-full h-full group-hover:scale-110 transition-transform duration-700">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent"></div>
                        <div class="absolute bottom-6 left-6 text-white">
                            <p class="text-xs font-medium opacity-80 uppercase tracking-widest">${p.type}</p>
                            <h3 class="text-xl font-bold">${p.name}</h3>
                        </div>
                    </div>
                    <div class="flex justify-between items-center px-1">
                         <span class="text-xs font-bold text-rose-500 flex items-center gap-1">
                            <i data-lucide="camera" size="14"></i> VIEW PHOTOS
                         </span>
                         <span class="text-xs text-slate-400 font-bold">★ ${p.rating}</span>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
            window.scrollTo({ top: document.getElementById('results').offsetTop - 100, behavior: 'smooth' });
        }

        function toggleLoading(isLoading) {
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const searchBtn = document.getElementById('searchBtn');

            if (isLoading) {
                btnText.innerText = "Consulting AI...";
                btnLoader.classList.remove('hidden');
                searchBtn.disabled = true;
                searchBtn.classList.add('opacity-50');
            } else {
                btnText.innerText = "Plan My Trip";
                btnLoader.classList.add('hidden');
                searchBtn.disabled = false;
                searchBtn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
